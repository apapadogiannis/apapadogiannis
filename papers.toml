[[tool]]
title = "Dual-Risk DCF Calculator: the discount rate and the forecast, separated"
question = "How much of a valuation gap is the forecast, and how much the discount rate?"
repo = "dual-risk-calculator"
page = "https://apapadogiannis.github.io/dual-risk-calculator/"
paper = "From Unified Discounting to Dual-Risk: A New Lens on DCF Valuation"
link_label = "Calculator"
workflow = "check.yml"
skill_for = "Splitting a valuation gap into the discount rate and the forecast, from your own numbers"
skill_ask = "My forecast is 90 a year for five years and the benchmark is 100. At 8%, what is K and the effective rate?"
caption = "A worked example: two forecasts of the same asset, valued at the same benchmark rate."
figure = "assets/dual-risk-calculator-light.svg"
figure_alt = "Two bars: the value of a benchmark forecast and of a forecast 10% lower, both discounted at 8%, with the valuation ratio K, the gain of capital and the effective rate"
summary = "Enter a benchmark rate and two views of the same asset, two forecasts or a forecast and a price, and the calculator puts the whole gap into one number, the valuation ratio K, with the gain of capital and the effective discount rate that follow from it. It also runs the same reading over your own price series. It computes in your browser and sends nothing out, and it runs as an MCP server for an AI assistant on your own machine."
