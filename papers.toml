# The data behind the profile page. Edit this file, then run:  python3 build.py
# Each [[paper]] is one entry. Only "title" and "question" are required.
#   question  : creation | returns | valuation | capture
#               (value creation, returns, valuation with the dual-risk framework, value capture)
#   venue     : journal and year, for published or forthcoming papers (leave out while under review)
#   ssrn      : SSRN abstract number
#   published : link to the published article
#   repo      : name of the replication package on GitHub;  zenodo : its Zenodo DOI
#   featured  : true for the one package shown as a card for its question (needs figure, figure_alt and
#               summary, one short sentence: the cards are narrow)

[profile]
name = "Agisilaos Papadogiannis"
intro = [
  "Engineer by training (PhD, MBA), based in The Hague. My first research career was in wireless communications, with IEEE publications that have drawn about 2,000 citations. I now do independent research in finance, published in peer-reviewed journals.",
  "I bring an engineer's habits to finance: state the model, measure the inputs, and publish the code so anyone can check the result. The work is unfunded and independent, and corrections are welcome.",
  "My work follows value through four questions: where it comes from (value creation), what return an asset must earn and can be expected to earn (returns), what it is worth once both are known (valuation), and what its holder actually keeps (value capture). Every empirical result comes with open data and code, written in Python and re-run automatically on GitHub.",
]
# The row of links under the name, copied to the page as written.
links = '''
<a href="https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=7457522"><img src="https://img.shields.io/badge/SSRN-154881?style=for-the-badge&logo=ssrn&logoColor=white" alt="SSRN"></a>
