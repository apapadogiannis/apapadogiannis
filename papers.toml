# The data behind the profile page. Edit this file, then run:  python3 build.py
# Each [[paper]] is one entry. Only "title" and "question" are required.
#   question  : creation | returns | valuation | capture
#               (value creation, returns, valuation with the dual-risk framework, value capture)
#   record    : repository of a paper record, for a paper with nothing to compute (conventions A1);
#               not counted as a replication package
#   venue     : journal and year, for a paper published or accepted after peer review (leave out while
#               under review). Every paper with a venue is shown and counted as peer-reviewed
#   ssrn      : SSRN abstract number
#   published : link to the published article
#   repo      : name of the replication package on GitHub;  zenodo : its Zenodo DOI
#   demo      : link to an interactive demo page served from the repo
#   guide     : true when the package has an llms.txt guide for AI agents and programs at its root
#   tool      : repository name of a [[tool]] below that runs this paper's method on live data
#   finding   : one plain sentence on what the paper asks and finds, shown under its line and in llms.txt.
#               Write it from the paper's own abstract or guide; leave it out if you are not sure
#   featured  : true for the one package shown as a card for its question (needs figure, figure_alt and
#               summary, one short sentence: the cards are narrow)

# Each [[tool]] is one application: software that runs the research on live data but is not the replication
# of a paper. All fields are required.
#   title, repo, page (the live address), question (what it answers, one short sentence, for its card on the
#   profile page), summary (two or three sentences, for the tools page), figure, figure_alt,
#   paper (the title of the [[paper]] whose method it uses), workflow (the file name of its check, for the badge),
#   skill_for and skill_ask (what its skill answers, and a question to try), caption (one line above its picture)
#   Tools appear everywhere in the order they are written here, on the profile page as one row of cards.
#   wide, pitch and points are kept for a full-width panel (build.py, lead) and are not shown at present.
#   updated: how often its figure changes, two words after the date in the table of answers under the name (optional)
#   row_question: the question as worded in that table, if narrower than "question"
#   figures_file: address of one small file with the latest figures, if the tool publishes one
# The latest figures shown with each tool are not typed here: "python3 build.py --fetch" reads them from the
# tool's own data file into live.json, and the update workflow does so every month.

[profile]
name = "Agisilaos Papadogiannis"
# One sentence under the name: what the work is.
position = "Live answers to three investor questions, recomputed on a schedule from public filings and market data."
# The second sentence under the name: what stands behind each figure.
forms = "Each figure is dated, checked automatically before it is published, and backed by a paper you can read and code you can run."
# One small line under the table of answers.
note = "Free, no account. Every figure is also a data file your AI assistant can read. Methods: {papers} papers, {published_word} of them peer-reviewed."
# The plain row of links under it: label, address.
links = [
  ["SSRN", "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=7457522"],
  ["Google Scholar", "https://scholar.google.com/citations?user=RihXr08AAAAJ"],
  ["ORCID", "https://orcid.org/0009-0002-7753-7052"],
  ["Substack", "https://scarcitythinker.substack.com"],
  ["Email", "mailto:apapadogiannis@gmail.com"],
]
# In the research section, under its introduction. {journals} is taken from this file.
checked = "The peer-reviewed articles are in {journals}."
# Above the map.
intro = [
  "{papers} papers, {published} of them peer-reviewed: published or accepted by a journal after review by its referees. {packages} come with a replication package, the data and code to recompute every number. Together they follow value through four questions: where it comes from, what return it must earn, what it is worth once both are known, and what its holder actually keeps.",
]
# The section on skills. {skills} is counted.
skills = [
  "Add one short instruction file, a skill, to an AI assistant such as Claude, and it answers from the latest figures here, with the date and the source, instead of from memory. Free, no account or key.",
]
# What the skill of the whole account is for, and a question to try.
skill_for = "A number or a finding from any of the papers"
skill_ask = "What does the age-rule paper report for Bitcoin's expected return?"
# One line for programs, under the links.
agents = "AI agents and programs: start at [llms.txt](llms.txt), the index of every tool, paper and data file, with the tools' latest figures and one sentence on what each paper finds."
# The last section.
about = "Engineer by training (PhD, MBA). My first research career was in wireless communications, with IEEE publications that have drawn about 2,000 citations. The finance research is independent and unfunded. Corrections and questions are welcome, by email or as an issue on the repository concerned."

