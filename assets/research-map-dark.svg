<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" width="720" height="566" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Three research questions and the framework that joins the first two</title>
<desc id="d">Two overlapping circles. Left: valuation, what an asset is worth. Right: pricing, what return it must earn. Their overlap is the dual-risk framework, in which expected cash flows shift the required return and the required return sets the value. Both lead to a band below: capture, what the holder actually keeps.</desc>
<circle cx="255" cy="195" r="165" fill="#4c8dff" fill-opacity="0.22" stroke="#79aaff" stroke-width="2"/>
<circle cx="465" cy="195" r="165" fill="#2fbf8a" fill-opacity="0.22" stroke="#5fd3a6" stroke-width="2"/>
<text x="192" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#79aaff" letter-spacing="1.2">VALUATION</text>
<text x="192" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">what an asset is worth</text>
<text x="192" y="206" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">scarcity as the source of value</text>
<text x="192" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">Bitcoin and blockchain networks</text>
<text x="192" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">AI and abundance</text>
<text x="528" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#5fd3a6" letter-spacing="1.2">PRICING</text>
<text x="528" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">what return it must earn</text>
<text x="528" y="206" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">required returns</text>
<text x="528" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">expected returns</text>
<text x="528" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">the MCM equation</text>
<line x1="328" y1="152" x2="390" y2="152" stroke="#79aaff" stroke-width="2.5" stroke-linecap="round"/><path d="M392 152 l-9 -5.5 v11 z" fill="#79aaff"/>
<text x="360" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Dual-risk</text>
<text x="360" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">framework</text>
<line x1="392" y1="236" x2="330" y2="236" stroke="#5fd3a6" stroke-width="2.5" stroke-linecap="round"/><path d="M328 236 l9 -5.5 v11 z" fill="#5fd3a6"/>
<text x="360" y="398" text-anchor="middle" font-size="13.5" fill="#e6edf3"><tspan font-weight="700" fill="#79aaff">Valuation → pricing:</tspan> expected cash flows shift the required return</text>
<text x="360" y="420" text-anchor="middle" font-size="13.5" fill="#e6edf3"><tspan font-weight="700" fill="#5fd3a6">Pricing → valuation:</tspan> the required return sets the value</text>
<line x1="360" y1="436" x2="360" y2="460" stroke="#f2b468" stroke-width="2.5" stroke-linecap="round"/><path d="M360 462 l-5.5 -9 h11 z" fill="#f2b468"/>
<rect x="90" y="468" width="540" height="84" rx="14" fill="#e89a3c" fill-opacity="0.22" stroke="#f2b468" stroke-width="2"/>
