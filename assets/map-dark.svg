<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" width="720" height="486" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Research map</title><desc>Two overlapping circles. Value creation: where value comes from, through cash flows, scarcity, desirability and adoption. Returns: required and expected, what an asset must earn and is expected to earn. Their overlap is valuation, the dual-risk framework: a valuation carries two risks, in what the asset delivers and in the return it must earn. An arrow leads to a band below: value capture, what the holder actually keeps.</desc>
<circle cx="260" cy="172" r="160" fill="#4c8dff" fill-opacity="0.22" stroke="#79aaff" stroke-width="2"/>
<circle cx="460" cy="172" r="160" fill="#2fbf8a" fill-opacity="0.22" stroke="#5fd3a6" stroke-width="2"/>
<text x="200" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#79aaff" letter-spacing="1.1">VALUE CREATION</text>
<text x="200" y="175" text-anchor="middle" font-size="15" font-weight="500" fill="#e6edf3">where value comes from</text>
<line x1="170" y1="192" x2="230" y2="192" stroke="#79aaff" stroke-width="1.5" stroke-opacity="0.55"/>
<text x="200" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#79aaff">cash flows · scarcity</text>
<text x="200" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#79aaff">desirability · adoption</text>
<text x="520" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#5fd3a6" letter-spacing="1.1">RETURNS</text>
<text x="520" y="175" text-anchor="middle" font-size="15" font-weight="500" fill="#e6edf3">required and expected</text>
<line x1="490" y1="192" x2="550" y2="192" stroke="#5fd3a6" stroke-width="1.5" stroke-opacity="0.55"/>
<text x="520" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#5fd3a6">what an asset must earn</text>
<text x="520" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#5fd3a6">and is expected to earn</text>
<text x="360" y="166" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e6edf3" letter-spacing="1.0">VALUATION</text>
<text x="360" y="187" text-anchor="middle" font-size="13" font-weight="400" fill="#9198a1">dual-risk</text>
<text x="360" y="203" text-anchor="middle" font-size="13" font-weight="400" fill="#9198a1">framework</text>
<text x="360" y="366" text-anchor="middle" font-size="14" font-weight="400" fill="#e6edf3">A valuation carries two risks: in what the asset delivers, and in the return it must earn</text>
<line x1="360" y1="380" x2="360" y2="398" stroke="#f2b468" stroke-width="2.5" stroke-linecap="round"/><path d="M360 406 l-5.5 -9 h11 z" fill="#f2b468"/>
<rect x="100" y="412" width="520" height="66" rx="14" fill="#e89a3c" fill-opacity="0.22" stroke="#f2b468" stroke-width="2"/>
<text x="360" y="441" text-anchor="middle" font-size="19" font-weight="700" fill="#f2b468" letter-spacing="1.1">VALUE CAPTURE</text>
<text x="360" y="465" text-anchor="middle" font-size="15" font-weight="500" fill="#e6edf3">what the holder actually keeps</text>
</svg>
