<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" width="720" height="446" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Two research questions and the framework that joins them</title>
<desc id="d">Two overlapping circles. Left: valuation, what an asset is worth. Right: pricing, what return it must earn. Their overlap is the dual-risk framework, in which each affects the other: expected cash flows shift the required return, and the required return sets the value.</desc>
<circle cx="255" cy="195" r="165" fill="#2f6fde" fill-opacity="0.16" stroke="#1f56b8" stroke-width="2"/>
<circle cx="465" cy="195" r="165" fill="#1a9a6c" fill-opacity="0.16" stroke="#0f7550" stroke-width="2"/>
<text x="192" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1f56b8" letter-spacing="1.2">VALUATION</text>
<text x="192" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">what an asset is worth</text>
<text x="192" y="206" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">scarcity as the source of value</text>
<text x="192" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">Bitcoin and blockchain networks</text>
<text x="192" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">AI and abundance</text>
<text x="528" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#0f7550" letter-spacing="1.2">PRICING</text>
<text x="528" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">what return it must earn</text>
<text x="528" y="206" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">required returns</text>
<text x="528" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">expected returns</text>
<text x="528" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#59636e">the MCM equation</text>
<line x1="328" y1="152" x2="390" y2="152" stroke="#1f56b8" stroke-width="2.5" stroke-linecap="round"/><path d="M392 152 l-9 -5.5 v11 z" fill="#1f56b8"/>
<text x="360" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Dual-risk</text>
<text x="360" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">framework</text>
<line x1="392" y1="236" x2="330" y2="236" stroke="#0f7550" stroke-width="2.5" stroke-linecap="round"/><path d="M328 236 l9 -5.5 v11 z" fill="#0f7550"/>
<text x="360" y="402" text-anchor="middle" font-size="13.5" fill="#1f2328"><tspan font-weight="700" fill="#1f56b8">Valuation → pricing:</tspan> expected cash flows shift the required return</text>
<text x="360" y="426" text-anchor="middle" font-size="13.5" fill="#1f2328"><tspan font-weight="700" fill="#0f7550">Pricing → valuation:</tspan> the required return sets the value</text>
</svg>
