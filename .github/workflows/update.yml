name: update

on:
  schedule:
    - cron: "23 6 8 * *"   # eighth of each month, after both tools have updated
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Read the tools' latest figures, redraw their pictures and rebuild the page
        run: python3 build.py --fetch
      - name: Store the page if a figure has changed
        run: |
          git add live.json README.md llms.txt skill assets
          if git diff --cached --quiet; then echo "No new figures."; exit 0; fi
          git config user.name "Agisilaos Papadogiannis"
          git config user.email "apapadogiannis@gmail.com"
          git commit -m "Page: latest figures of the tools"
          git pull --rebase
          git push
