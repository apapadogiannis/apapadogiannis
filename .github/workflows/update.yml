name: update

on:
  schedule:
    - cron: "23 6 8 * *"   # eighth of each month, after both tools have updated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # this job stores the new data; no other job can write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the token is not left in .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the tools' latest figures, redraw their pictures and rebuild the page
        run: python3 build.py --fetch
      - name: Store the page if a figure has changed
        env:
          GH_TOKEN: ${{ github.token }}   # for the push below, and for no other step
        run: |
          git add live.json README.md llms.txt tools.json skill assets
          if git diff --cached --quiet; then echo "No new figures."; exit 0; fi
          git config user.name "Agisilaos Papadogiannis"
          git config user.email "apapadogiannis@gmail.com"
          git commit -m "Page: latest figures of the tools"
          git pull --rebase
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
